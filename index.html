<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PokéScan">
<meta name="theme-color" content="#121211">
<title>PokéScan</title>
<style>
:root{--bg:#121211;--card:#1e1e1c;--tx:#f2f2ee;--mut:#9d9d96;--bd:#33332f;--gr:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,system-ui,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top,0px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);overflow:hidden}
#top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:78px;flex:none}
#price{font-size:28px;font-weight:800;color:var(--gr);line-height:1}
#price small{display:block;font-size:11px;font-weight:500;color:var(--mut);margin-top:4px}
#last{height:62px;aspect-ratio:63/88;object-fit:cover;border-radius:6px;border:1px solid var(--bd);justify-self:center;background:var(--card)}
#hbtn{justify-self:end;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:grid;place-items:center;padding:0}
#stage{position:relative;flex:1;min-height:0;max-height:560px;border-radius:20px;overflow:hidden;background:#000;border:1px solid var(--bd)}
#cam{width:100%;height:100%;object-fit:cover;display:block}
#frame{position:absolute;left:50%;top:50%;height:86%;aspect-ratio:63/88;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.65);border-radius:12px;pointer-events:none}
#frame.ok{border-color:var(--gr)}#frame.busy{border-color:#fbbf24}
#msg{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.7));font-size:14px;text-align:center}
#info{flex:none;padding:12px 2px 0;min-height:70px}
#info .n{font-size:18px;font-weight:700}#info .m{color:var(--mut);font-size:13px}
#info a{color:var(--gr);margin-right:14px;font-size:14px;font-weight:600}
#drawer{position:fixed;top:0;bottom:0;right:0;width:min(88vw,360px);background:var(--card);border-left:1px solid var(--bd);z-index:20;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#drawer.open{transform:none}
#dh{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--bd)}
#dh b{font-size:18px}#dh button{background:none;border:0;color:var(--mut);font-size:26px;padding:0 6px}
#list{flex:1;overflow:auto;padding:0 16px}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.item img{width:44px;aspect-ratio:63/88;object-fit:cover;border-radius:5px}
.item .t{flex:1;min-width:0}.item .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{color:var(--mut);font-size:13px}.item .p{color:var(--gr);font-weight:700}
.x{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 6px}
#dt{padding:14px 16px;border-top:1px solid var(--bd);font-size:14px;color:var(--mut)}#dt b{color:var(--tx);font-size:18px}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;display:none}
</style>
</head>
<body>
<div id="top">
  <div id="price">—<small>Cardmarket</small></div>
  <img id="last" alt="Ultima carta" hidden>
  <button id="hbtn" aria-label="Cronologia"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
</div>
<div id="stage"><video id="cam" autoplay playsinline muted></video><div id="frame"></div><div id="msg">Avvio fotocamera…</div></div>
<div id="info"></div>
<div id="shade"></div>
<div id="drawer">
  <div id="dh"><b>Ultime 10 carte</b><button id="close" aria-label="Chiudi">×</button></div>
  <div id="list"></div><div id="dt"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const v=$("cam"),st=$("stage"),sc=document.createElement("canvas");sc.width=24;sc.height=32;const sx=sc.getContext("2d",{willReadFrequently:true});
const KEY="pokescan.cards";
let cards=[];try{cards=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
let busy=false,state="idle",stable=0,prev=null,ref=null,until=0,worker=null;
const eur=n=>(n||0).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2});
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const msg=t=>{$("msg").textContent=t};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(cards))}catch(e){msg("Memoria piena: elimina qualche carta")}};

function sig(){sx.drawImage(v,0,0,24,32);const d=sx.getImageData(0,0,24,32).data,a=new Float32Array(768);for(let i=0;i<768;i++)a[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/3;return a}
const diff=(a,b)=>{let s=0;for(let i=0;i<a.length;i++)s+=Math.abs(a[i]-b[i]);return s/a.length};

function cropCard(){
  const vw=v.videoWidth,vh=v.videoHeight,A=st.clientWidth/st.clientHeight,V=vw/vh;
  let visW,visH;if(V>A){visH=vh;visW=vh*A}else{visW=vw;visH=vw/A}
  const h=visH*.86,w=h*63/88,x=(vw-w)/2,y=(vh-h)/2,s=Math.min(1.6,1100/h);
  const c=document.createElement("canvas");c.width=w*s;c.height=h*s;c.getContext("2d").drawImage(v,x,y,w,h,0,0,c.width,c.height);return c}
function thumb(c){const t=document.createElement("canvas"),s=150/c.height;t.width=c.width*s;t.height=150;t.getContext("2d").drawImage(c,0,0,t.width,t.height);return t.toDataURL("image/jpeg",.55)}

async function startCam(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920}},audio:false});
    v.srcObject=s;msg("Preparazione del riconoscimento…");
    worker=await Tesseract.createWorker("eng");
    msg("Inquadra una carta: la scansione è automatica");setInterval(tick,450);
  }catch(e){msg("Serve il permesso alla fotocamera (e una connessione internet)")}
}
function tick(){
  if(busy||!v.videoWidth||!worker||Date.now()<until)return;
  const cur=sig(),mv=prev?diff(cur,prev):99;prev=cur;
  if(state==="done"){if(ref&&diff(cur,ref)>18){state="idle";stable=0;$("frame").className="";msg("Inquadra una carta: la scansione è automatica")}return}
  stable=mv<8?stable+1:0;if(stable>=3){stable=0;scan()}
}

async function lookup(text){
  const m=text.match(/(\d{1,3})\s*\/\s*(\d{1,3})/);
  if(!m)return null;
  const num=String(parseInt(m[1],10)),tot=String(parseInt(m[2],10));
  const q=`number:"${num}" set.printedTotal:${tot}`;
  const r=await fetch("https://api.pokemontcg.io/v2/cards?pageSize=20&q="+encodeURIComponent(q));
  if(!r.ok)throw new Error("api");
  const list=(await r.json()).data||[];if(!list.length)return null;
  const t=text.toLowerCase();
  return list.find(c=>t.includes(c.name.toLowerCase()))||list.find(c=>t.includes(c.name.toLowerCase().split(/[ -]/)[0]))||(list.length===1?list[0]:null);
}

async function scan(){
  busy=true;$("frame").className="busy";msg("Riconoscimento in corso…");
  const c=cropCard();
  try{
    const {data}=await worker.recognize(c);
    const card=await lookup(data.text);
    if(!card)throw new Error("nf");
    const cm=card.cardmarket&&card.cardmarket.prices,tp=card.tcgplayer&&card.tcgplayer.prices;
    let price=0,cur="EUR";
    if(cm&&(cm.trendPrice||cm.averageSellPrice))price=cm.trendPrice||cm.averageSellPrice;
    else if(tp){const k=Object.values(tp)[0];if(k&&k.market){price=k.market;cur="USD"}}
    const rec={id:card.id,name:card.name,number:card.number+"/"+card.set.printedTotal,set:card.set.name,price,cur,
      cm:(card.cardmarket&&card.cardmarket.url)||"",thumb:thumb(c),qty:1,at:Date.now()};
    const i=cards.findIndex(x=>x.id===rec.id);
    if(i>=0){rec.qty=(cards[i].qty||1)+1;cards.splice(i,1)}
    cards.unshift(rec);save();show(rec);render();
    $("frame").className="ok";msg(rec.qty>1?"Già in collezione: ora ne hai "+rec.qty:"Aggiunta alla collezione");
  }catch(e){
    $("frame").className="";until=Date.now()+2500;
    msg(e.message==="api"?"Servizio prezzi non raggiungibile, riprovo":"Carta non riconosciuta: più luce, carta dritta e ferma");
  }
  try{ref=sig()}catch(e){}
  state="done";busy=false;
}

function show(c){
  $("price").textContent=c.price?(c.cur==="USD"?"$ ":"")+eur(c.price)+(c.cur==="EUR"?" €":""):"n.d.";
  $("price").append(el("small","",c.cur==="USD"?"TCGplayer":"Cardmarket (trend)"));
  const im=$("last");im.src=c.thumb;im.hidden=false;
  const i=$("info");i.textContent="";
  i.append(el("div","n",c.name),el("div","m",c.number+" · "+c.set));
  const q=encodeURIComponent(c.name+" "+c.number.split("/")[0]);
  const links=el("div");links.style.marginTop="6px";
  const a1=el("a","","Cardmarket");a1.href=c.cm||"https://www.cardmarket.com/it/Pokemon/Products/Search?searchString="+q;
  const a2=el("a","","CardTrader");a2.href="https://www.cardtrader.com/search?q="+q;
  [a1,a2].forEach(a=>{a.target="_blank";a.rel="noopener";links.append(a)});i.append(links);
}

function render(){
  const L=$("list");L.textContent="";let tot=0,n=0;
  cards.forEach(c=>{n+=c.qty||1;if(c.cur==="EUR")tot+=(c.price||0)*(c.qty||1)});
  cards.slice(0,10).forEach(c=>{const r=el("div","item");
    const im=el("img");im.src=c.thumb;im.alt="";r.append(im);
    const t=el("div","t");t.append(el("div","n",c.name+((c.qty||1)>1?" ×"+c.qty:"")),el("div","m",c.number+" · "+c.set));
    const x=el("button","x","×");x.setAttribute("aria-label","Elimina");
    x.onclick=()=>{if(confirm("Eliminare "+c.name+"?")){cards=cards.filter(k=>k!==c);save();render()}};
    r.append(t,el("div","p",c.price?(c.cur==="USD"?"$":"")+eur(c.price)+(c.cur==="EUR"?" €":""):"n.d."),x);
    r.querySelector(".t").onclick=()=>{show(c);open(false)};L.append(r)});
  if(!cards.length)L.append(el("div","m","Nessuna carta scansionata."));
  const dt=$("dt");dt.textContent="";dt.append("Collezione: "+n+(n===1?" carta":" carte")+" · ",el("b","",eur(tot)+" €"));
}
const open=o=>{$("drawer").classList.toggle("open",o);$("shade").style.display=o?"block":"none"};
$("hbtn").onclick=()=>open(true);$("close").onclick=()=>open(false);$("shade").onclick=()=>open(false);
render();if(cards.length)show(cards[0]);
startCam();
</script>
</body>
</html>
